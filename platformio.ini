; Oil level monitor – DFRobot FireBeetle 2 ESP32-C5 + JSN-SR04T (battery powered, WiFi/MQTT)
;
; The official "espressif32" platform does not ship Arduino-ESP32 3.x (needed for
; the ESP32-C5), so the community maintained pioarduino platform is used. It has no
; PlatformIO board definition for the FireBeetle 2 C5 (the Arduino core has the
; variant), so it lives in boards/dfrobot_firebeetle2_esp32c5.json.
;
;   pio run -e firebeetle2_c5             -> build release firmware (no serial log)
;   pio run -e firebeetle2_c5_debug       -> build with serial log + 60 s interval
;   pio run -e firebeetle2_c5_calibration -> USB streaming firmware for the Android calibration app
;   pio test -e native                -> run tank/battery math unit tests on the PC

[platformio]
default_envs = firebeetle2_c5

[esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c5
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:firebeetle2_c5]
extends = esp32c5
build_flags =
    ${esp32c5.build_flags}
    -DOILMETER_DEBUG=0

[env:firebeetle2_c5_debug]
extends = esp32c5
build_type = debug
build_flags =
    ${esp32c5.build_flags}
    -DOILMETER_DEBUG=1

; Streams raw pings over USB serial for the Android calibration app (android/)
[env:firebeetle2_c5_calibration]
extends = esp32c5
build_src_filter =
    -<*>
    +<../calibration/main.cpp>
    +<sensor.cpp>
    +<battery_monitor.cpp>

; Host-side unit tests for the pure math in lib/OilMeterCore (no hardware needed)
[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
