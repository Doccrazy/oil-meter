; Oil level monitor – Seeed XIAO ESP32C6 + JSN-SR04T (battery powered, WiFi/MQTT)
;
; The official "espressif32" platform does not ship Arduino-ESP32 3.x (needed for
; the ESP32-C6), so the community maintained pioarduino platform is used.
;
;   pio run -e xiao_esp32c6           -> build release firmware (no serial log)
;   pio run -e xiao_esp32c6_debug     -> build with serial log + 60 s interval
;   pio test -e native                -> run tank/battery math unit tests on the PC

[platformio]
default_envs = xiao_esp32c6

[esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:xiao_esp32c6]
extends = esp32c6
build_flags =
    ${esp32c6.build_flags}
    -DOILMETER_DEBUG=0

[env:xiao_esp32c6_debug]
extends = esp32c6
build_type = debug
build_flags =
    ${esp32c6.build_flags}
    -DOILMETER_DEBUG=1

; Host-side unit tests for the pure math in lib/OilMeterCore (no hardware needed)
[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
